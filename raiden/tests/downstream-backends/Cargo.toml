# Exercise downstream client construction and the public builder API on both backends.
[package]
name = "raiden-downstream-backends"
version = "0.0.0"
edition = "2021"
rust-version = "1.91.1"
publish = false

[workspace]

[dependencies]
raiden = { path = "../..", default-features = false, features = ["tracing"] }
rusoto_core = { version = "0.48", default-features = false, features = ["native-tls"], optional = true }
rusoto_dynamodb = { version = "0.48", default-features = false, features = ["native-tls"], optional = true }
aws-config = { version = "1.8.18", optional = true }
aws-sdk-dynamodb = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-smithy-http-client = { version = "1.1.13", features = ["rustls-aws-lc"], optional = true }
tracing = "0.1"

[features]
default = ["rusoto"]
rusoto = ["raiden/rusoto", "dep:rusoto_core", "dep:rusoto_dynamodb"]
aws-sdk = ["raiden/aws-sdk", "dep:aws-config", "dep:aws-sdk-dynamodb", "dep:aws-smithy-http-client"]
