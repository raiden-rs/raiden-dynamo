name: Continuous Integration
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v1.x
      - name: Run deno fmt and deno lint
        run: |
          deno fmt --check setup
          deno lint
      - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          profile: minimal
          toolchain: 1.91.1
          override: true
      - name: Install deps
        run: sudo apt-get install libssl-dev
      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt
      - name: Run rustfmt
        uses: actions-rs/cargo@ae10961054e4aa8b4aa7dffede299aaf087aa33b # v1.0.1
        with:
          command: fmt
          args: -- --check
      - name: Run clippy
        uses: actions-rs/cargo@ae10961054e4aa8b4aa7dffede299aaf087aa33b # v1.0.1
        with:
          command: clippy
          args: -- -D warnings
      - name: Cache cargo build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Check feature combinations
        run: |
          cargo check -p raiden --all-targets --no-default-features --features rusoto
          cargo check -p raiden --all-targets --no-default-features --features rusoto_native_tls
          cargo check -p raiden --all-targets --no-default-features --features aws-sdk
      - name: Check known vulnerable dependencies
        run: python3 scripts/check-security-dependencies.py
      - name: Check downstream clients and builders on both backends
        run: |
          cargo check --locked --manifest-path raiden/tests/downstream-backends/Cargo.toml
          cargo check --locked --manifest-path raiden/tests/downstream-backends/Cargo.toml --no-default-features --features aws-sdk
          cargo tree --locked --manifest-path raiden/tests/downstream-backends/Cargo.toml --no-default-features --features aws-sdk -e normal --prefix none > downstream-aws-sdk-deps.txt
          if grep -E '^(native-tls|hyper-tls|openssl-sys) ' downstream-aws-sdk-deps.txt; then
            echo "the AWS SDK rustls backend must not enable native-tls"
            exit 1
          fi
      - name: test
        run: make test
      - name: Differential attribute exploration
        run: |
          python3 scripts/check-attribute-backends.py --cases 10000
          python3 scripts/check-attribute-backends.py --cases 10000 --include-malformed
      - name: Differential operational exploration
        run: |
          python3 scripts/check-operational-backends.py --output-dir operational-errors
          python3 scripts/check-operational-backends.py --responses --output-dir operational-responses
      - name: Preserve operational exploration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-differential
          path: |
            operational-errors
            operational-responses
