name: Continuous Integration
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v1.x
      - name: Run deno fmt and deno lint
        run: |
          deno fmt --check setup
          deno lint
      - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          profile: minimal
          toolchain: 1.88.0
          override: true
      - uses: jdx/mr-boxington-action@d0825fbaf3cc36ca2609aa38e71046265a1f1e37 # v1
      - name: Install deps
        run: sudo apt-get install libssl-dev
      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt
      - name: Run rustfmt
        uses: actions-rs/cargo@ae10961054e4aa8b4aa7dffede299aaf087aa33b # v1.0.1
        with:
          command: fmt
          args: -- --check
      - name: Run clippy
        run: mbx clippy -- -D warnings
      - name: Check feature combinations
        run: |
          mbx check -p raiden --all-targets --no-default-features --features rusoto
          mbx check -p raiden --all-targets --no-default-features --features rusoto_native_tls
          mbx check -p raiden --all-targets --no-default-features --features rustls
          mbx check -p raiden --all-targets --no-default-features --features aws-sdk
      - name: Check a downstream crate that selects Rusoto rustls
        run: |
          mbx check --locked --manifest-path raiden/tests/downstream-rustls/Cargo.toml
          cargo tree --locked --manifest-path raiden/tests/downstream-rustls/Cargo.toml -e normal --prefix none > downstream-rustls-deps.txt
          if grep -E '^(native-tls|hyper-tls|openssl-sys) ' downstream-rustls-deps.txt; then
            echo "native-tls must not be enabled when raiden's rustls feature is selected"
            exit 1
          fi
      - name: test
        run: make test CARGO=mbx
